name: Release
run-name: Release (${{ github.ref_name }})

"on":
  push:
    tags:
      - "*"

# Kill running refresh-images.yml workflows
concurrency:
  group: refresh-images
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  verify-tagged-commit:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on origin/main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, but that commit is not on origin/main." >&2
            echo "Push the commit to origin/main before pushing the release tag." >&2
            exit 1
          fi

  change-validation:
    needs: verify-tagged-commit
    uses: ./.github/workflows/change-validation.yml

  matrix:
    name: Build matrix
    needs: verify-tagged-commit
    uses: ./.github/workflows/prepare-matrix.yml

  test-non-redistributable:
    needs:
      - verify-tagged-commit
      - change-validation
      - matrix
    uses: ./.github/workflows/test-non-redistributable-agents.yml
    with:
      matrix_images: ${{ needs.matrix.outputs.matrix_nr_images }}
      git_ref: ${{ github.ref_name }}

  build-images:
    needs:
      - verify-tagged-commit
      - change-validation
      - matrix
      - test-non-redistributable
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix_images) }}
    uses: ./.github/workflows/build.yml
    with:
      agent: ${{ matrix.agent }}
      base: ${{ matrix.base }}
      git_ref: ${{ github.ref_name }}

  release:
    runs-on: ubuntu-26.04
    needs:
      - test-non-redistributable
      - build-images
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: "Release: Package release artifacts"
        run: |
          mkdir dist
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          tar -czf dist/"${REPO_NAME}".tar.gz \
            agents \
            Dockerfile
          tar -czf dist/"${REPO_NAME}"-smoke-tests.tar.gz \
            tests/agents/smoke

      - name: "Release: Create SHA256SUMS"
        run: |
          cd dist
          LC_ALL=C find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | \
            sort -z | \
            xargs -0 sha256sum \
            > SHA256SUMS

      - name: "Release: Keyless-sign SHA256SUMS"
        run: |
          cd dist
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      - name: "Release: Create GitHub release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --target "${GITHUB_SHA}" \
            --generate-notes
